name: Goose review - summary
description: >-
  The last step of a review run: one comment for the pull request, always
  its last item, with this run's lanes (models, checks, findings found and
  posted, rejected, already answered, withheld, links to their jobs) on
  top and every earlier run folded below. Runs no model.
author: Stephan Meijer

inputs:
  github-token:
    description: Needs actions read (the job links), issues write and pull-requests write.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # A lane whose post job failed before writing its result has none; the
    # summary then reports that lane from its job's conclusion.
    - name: Fetch the lanes' results
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: goose-result-*
        merge-multiple: true
        path: ${{ runner.temp }}/results

    - name: Post the summary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        mkdir -p "$RUNNER_TEMP/results"
        python3 "$GITHUB_ACTION_PATH/../goose_review.py" summary \
          --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
          --results "$RUNNER_TEMP/results"

# One lane of the pre-composed Goose review (review.yml calls it once per
# lane): a `review` job, where the model has a shell and each finding is
# posted as soon as a second model confirms it, and a `post` job that runs
# no model and finishes the lane.
#
# The review job's token can write to the pull request, and the model must
# never get it. Only the poster holds it: started first, while sudo still
# exists, as a user of its own, with the token in its memory only; the
# model reaches it through a socket and gets back only "posted" or why not.
# Then harden-runner limits the network to GitHub, the providers and what
# the caller's tools and setup need, and removes sudo. No step after the
# model is given the token (harden-runner gets none, and the checkout is a
# plain fetch in the poster action): the model can rewrite what later steps
# run. What the job uploads is scrubbed of the provider settings, and
# `post` scrubs again on its own runner. The job names `review` and `post`
# are what the summary links a lane's row to.
name: Goose review lane

on:
  workflow_call:
    inputs:
      lane: { type: string, required: true }
      provider: { type: string, required: true }
      model: { type: string, required: true }
      verify-provider: { type: string, required: true }
      verify-model: { type: string, required: true }
      verify-backup-provider: { type: string, default: "" }
      verify-backup-model: { type: string, default: "" }
      checks: { type: string, default: "" }
      jobs: { type: number, default: 2 }
      checks-dir: { type: string, default: .agents/checks }
      facts-dir: { type: string, default: .agents/facts }
      providers-dir: { type: string, default: .github/goose/providers }
      ignore: { type: string, default: "" }
      tools-file: { type: string, default: "" }
      tools: { type: string, default: "" }
      rules-file: { type: string, default: "" }
      budget-minutes: { type: number, default: 45 }
      # Deprecated: added to budget-minutes.
      verify-budget-minutes: { type: number, default: 0 }
      egress-endpoints: { type: string, default: "[]" }
      setup: { type: string, default: "" }
      runs-on: { type: string, default: ubuntu-latest }
      review-timeout-minutes: { type: number, default: 60 }
      install-goose: { type: boolean, default: true }
    secrets:
      PROVIDER_ROUTES:
        required: false
      PROVIDER_ENV:
        required: false

permissions: {}

jobs:
  review:
    name: review
    runs-on: ${{ inputs.runs-on }}
    # Bounded by time, not turns: the checks, and the verification of what
    # they post, share budget-minutes.
    timeout-minutes: ${{ inputs.review-timeout-minutes }}
    # Advisory: a lane that fails must not fail the pull request; `post`
    # says on it that the review did not run.
    continue-on-error: true
    permissions:
      contents: read
      # The poster posts the findings; the answered findings are read in a
      # step before the model runs. The model never holds the token.
      pull-requests: write
    steps:
      # First, while sudo still exists: see the header. It also checks out
      # the pull request's head (a fetch: actions/checkout's post step would
      # get the token after the model has run).
      - uses: StephanMeijer/goose-review/poster@54f2bd9c019e42a84d643dd59bf1fccc376aac70
        with:
          lane: ${{ inputs.lane }}
          model: ${{ inputs.model }}
          verify-model: ${{ inputs.verify-model }}
          verify-backup-model: ${{ inputs.verify-backup-model }}
          provider-routes: ${{ secrets.PROVIDER_ROUTES }}
          provider-env: ${{ secrets.PROVIDER_ENV }}

      # Everything after this step can reach only the endpoints listed; the
      # agent splits the list on single spaces, so the caller's entries are
      # joined with exactly that. The
      # model has a shell here, so sudo goes too: with it, the model could
      # lift the policy. Artifact storage is GitHub's own accounts by name,
      # not *.blob.core.windows.net, where anyone can create an account.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Its post step runs after the model: it gets no token.
          token: ""
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443
            ${{ join(fromJSON(inputs.egress-endpoints), ' ') }}


      # The caller's tools, pinned by sha256, before its setup (which may
      # use them) and before any secret or model.
      - if: inputs.tools != ''
        uses: StephanMeijer/goose-review/tools@54f2bd9c019e42a84d643dd59bf1fccc376aac70
        with:
          tools: ${{ inputs.tools }}

      # The caller's own preparation, before any secret or model.
      - name: Set up
        if: inputs.setup != ''
        shell: bash
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$SETUP"

      - uses: StephanMeijer/goose-review/review@54f2bd9c019e42a84d643dd59bf1fccc376aac70
        with:
          lane: ${{ inputs.lane }}
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          verify-provider: ${{ inputs.verify-provider }}
          verify-model: ${{ inputs.verify-model }}
          verify-backup-provider: ${{ inputs.verify-backup-provider }}
          verify-backup-model: ${{ inputs.verify-backup-model }}
          checks: ${{ inputs.checks }}
          jobs: ${{ inputs.jobs }}
          checks-dir: ${{ inputs.checks-dir }}
          facts-dir: ${{ inputs.facts-dir }}
          providers-dir: ${{ inputs.providers-dir }}
          ignore: ${{ inputs.ignore }}
          tools-file: ${{ inputs.tools-file }}
          tools: ${{ inputs.tools }}
          rules-file: ${{ inputs.rules-file }}
          budget-minutes: ${{ inputs.budget-minutes }}
          verify-budget-minutes: ${{ inputs.verify-budget-minutes > 0 && inputs.verify-budget-minutes || '' }}
          provider-routes: ${{ secrets.PROVIDER_ROUTES }}
          provider-env: ${{ secrets.PROVIDER_ENV }}
          install-goose: ${{ inputs.install-goose }}

  post:
    name: post
    needs: review
    # Also after a failed or timed-out review, so the pull request says the
    # review did not run; not when the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443

      - uses: StephanMeijer/goose-review/post@54f2bd9c019e42a84d643dd59bf1fccc376aac70
        with:
          lane: ${{ inputs.lane }}
          model: ${{ inputs.model }}
          verify-model: ${{ inputs.verify-model }}
          provider-routes: ${{ secrets.PROVIDER_ROUTES }}
          provider-env: ${{ secrets.PROVIDER_ENV }}

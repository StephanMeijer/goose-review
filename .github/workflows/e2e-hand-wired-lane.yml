# The hand-wired example's lane, for e2e-hand-wired.yml.
name: End-to-end (hand-wired) lane

on:
  workflow_call:
    inputs:
      lane: { type: string, required: true }
      provider: { type: string, required: true }
      model: { type: string, required: true }
      verify-provider: { type: string, required: true }
      verify-model: { type: string, required: true }
      verify-backup-provider: { type: string, default: "" }
      verify-backup-model: { type: string, default: "" }

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the fakes
        env:
          E2E_EGRESS_PROBE: "false"
        run: bash tests/e2e/setup.sh

      - uses: ./review
        with:
          lane: ${{ inputs.lane }}
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          verify-provider: ${{ inputs.verify-provider }}
          verify-model: ${{ inputs.verify-model }}
          verify-backup-provider: ${{ inputs.verify-backup-provider }}
          verify-backup-model: ${{ inputs.verify-backup-model }}
          checks-dir: tests/e2e/checks
          facts-dir: tests/e2e/facts
          providers-dir: tests/e2e/providers
          install-goose: "false"
          provider-routes: routed=http://127.0.0.1:8765/r1
          provider-env: |
            E2E_ROUTED_KEY=e2e-routed-key-0000
            E2E_DIRECT_KEY=e2e-direct-key-0000

  post:
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            tidy
            review
            post
            summary
            goose_review.py
            setup-providers.sh
            render-provider.sh
            options.sh
          persist-credentials: false
      - uses: ./post
        with:
          lane: ${{ inputs.lane }}
          model: ${{ inputs.model }}
          verify-model: ${{ inputs.verify-model }}
          provider-routes: routed=http://127.0.0.1:8765/r1
          provider-env: |
            E2E_ROUTED_KEY=e2e-routed-key-0000
            E2E_DIRECT_KEY=e2e-direct-key-0000

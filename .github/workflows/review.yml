# The pre-composed Goose review in three jobs: plan, review (every lane at
# once) and post (one review for all lanes, then the summary). A repository
# calls it from its own workflow (see
# examples/caller.yml), which keeps the trigger, the gate (no forks, drafts
# or release PRs) and the concurrency group:
#
#   jobs:
#     goose-review:
#       uses: StephanMeijer/goose-review/.github/workflows/review.yml@<sha>
#       with:
#         lanes: |
#           - lane: a
#             provider: ...
#             model: ...
#             verify-provider: ...
#             verify-model: ...
#         egress-endpoints: '["llm-proxy.example.com:443"]'
#       secrets:
#         PROVIDER_ROUTES: ${{ secrets.MY_ROUTES }}
#         PROVIDER_ENV: ${{ secrets.MY_PROVIDER_ENV }}
#
# What the review looks for is the caller's: its checks, facts and provider
# templates, in the directories named below. The actions this workflow uses
# are pinned to the commit holding their code (scripts/pin.sh), so pinning
# this file pins everything it runs.
name: Goose review

on:
  workflow_call:
    inputs:
      lanes:
        description: >-
          The lanes, as YAML (a list of mappings) or JSON. Each: lane,
          provider, model, verify-provider, verify-model, and optionally
          verify-backup-provider and verify-backup-model, checks (a list of
          check names) and jobs (the lane's checks at once, default 2).
          Checked before any lane runs; see the README. All lanes run at
          once, in one job.
        type: string
        required: true
      checks-dir:
        type: string
        default: .agents/checks
      facts-dir:
        type: string
        default: .agents/facts
      providers-dir:
        type: string
        default: .github/goose/providers
      ignore:
        description: Globs never reviewed, one per line.
        type: string
        default: ""
      tools-file:
        description: A file appended to the tools prompt.
        type: string
        default: ""
      rules-file:
        description: A file replacing the built-in rules.
        type: string
        default: ""
      tools:
        description: >-
          Tools to install in the review job and announce to the model, as
          YAML (a list of mappings) or JSON. Each: name, url, sha256, use,
          and optionally path and version. Installed before `setup`;
          checked by the plan job. See the README.
        type: string
        default: ""
      budget-minutes:
        description: Each lane's wall-clock budget for its checks; the lanes run at once.
        type: number
        default: 35
      verify-budget-minutes:
        description: Each lane's wall-clock budget for verification.
        type: number
        default: 12
      egress-endpoints:
        description: >-
          JSON list of further host:port entries the review job may reach:
          the providers' hosts (or your egress proxy's), and whatever
          `setup` downloads from. A list, not lines: harden-runner splits
          its allow-list on single spaces only.
        type: string
        default: "[]"
      setup:
        description: >-
          Shell commands run in the review job after the checkout, before any
          secret or model: the project's own preparation (e.g. `cargo fetch
          --locked`, so the model can read dependency sources).
        type: string
        default: ""
      runs-on:
        type: string
        default: ubuntu-latest
      review-timeout-minutes:
        type: number
        default: 60
      install-goose:
        description: Install Goose. For tests, `false` with a `goose` put on PATH by `setup`.
        type: boolean
        default: true
    secrets:
      PROVIDER_ROUTES:
        description: Lines `<template name>=<url>`; see the review action.
        required: false
      PROVIDER_ENV:
        description: Lines `NAME=value` that only the Goose process gets; see the review action.
        required: false

permissions: {}


jobs:
  # First, in seconds: read and check the lanes against the checks and
  # provider templates -- a mistake in them stops the run here, with the
  # errors on the run's page, before anything is posted -- then collapse
  # the review's own resolved threads and mark this run as running in the
  # summary comment. No model runs here.
  plan:
    name: plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      # Only the configuration, read as data: nothing from the pull request
      # runs in this job, which holds a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            ${{ inputs.checks-dir }}
            ${{ inputs.providers-dir }}
          persist-credentials: false
      - id: lanes
        uses: StephanMeijer/goose-review/lanes@54f2bd9c019e42a84d643dd59bf1fccc376aac70
        with:
          lanes: ${{ inputs.lanes }}
          checks-dir: ${{ inputs.checks-dir }}
          providers-dir: ${{ inputs.providers-dir }}
          tools: ${{ inputs.tools }}
      - uses: StephanMeijer/goose-review/tidy@54f2bd9c019e42a84d643dd59bf1fccc376aac70

  # Every lane at once, in one job: the models have a shell here, with a
  # read-only token and the network blocked but for GitHub, the providers
  # and what the caller's tools and setup need, and no sudo to lift that
  # limit. What it uploads is scrubbed of the provider settings; once a
  # model has had a shell here, nothing later in this job is trusted, so
  # `post` scrubs again on its own runner before publishing anything.
  review:
    name: review
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    # Bounded by time, not turns: each lane's checks share budget-minutes
    # and its verification gets verify-budget-minutes; the lanes run at once.
    timeout-minutes: ${{ inputs.review-timeout-minutes }}
    # Advisory: a failed review must not fail the pull request; `post`
    # says on it which lanes did not run.
    continue-on-error: true
    permissions:
      contents: read
      # Read-only, for the answered findings; only that step holds the token.
      pull-requests: read
    steps:
      # Everything after this step can reach only the endpoints listed; the
      # agent splits the list on single spaces, so the caller's entries are
      # joined with exactly that. The models have a shell here, so sudo
      # goes too: with it, a model could lift the policy. Artifact storage
      # is GitHub's own accounts by name, not *.blob.core.windows.net, where
      # anyone can create an account.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443
            ${{ join(fromJSON(inputs.egress-endpoints), ' ') }}

      # The PR head itself, not the merge commit: review comments are
      # anchored to the head's line numbers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The caller's tools, pinned by sha256, before its setup (which may
      # use them) and before any secret or model.
      - if: inputs.tools != ''
        uses: StephanMeijer/goose-review/tools@54f2bd9c019e42a84d643dd59bf1fccc376aac70
        with:
          tools: ${{ inputs.tools }}

      # The caller's own preparation, before any secret or model.
      - name: Set up
        if: inputs.setup != ''
        shell: bash
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$SETUP"

      - uses: StephanMeijer/goose-review/review@54f2bd9c019e42a84d643dd59bf1fccc376aac70
        with:
          lanes: ${{ needs.plan.outputs.lanes }}
          checks-dir: ${{ inputs.checks-dir }}
          facts-dir: ${{ inputs.facts-dir }}
          providers-dir: ${{ inputs.providers-dir }}
          ignore: ${{ inputs.ignore }}
          tools-file: ${{ inputs.tools-file }}
          tools: ${{ inputs.tools }}
          rules-file: ${{ inputs.rules-file }}
          budget-minutes: ${{ inputs.budget-minutes }}
          verify-budget-minutes: ${{ inputs.verify-budget-minutes }}
          provider-routes: ${{ secrets.PROVIDER_ROUTES }}
          provider-env: ${{ secrets.PROVIDER_ENV }}
          install-goose: ${{ inputs.install-goose }}

  # Last, and the only job that writes findings: one review with every
  # lane's, then the summary comment. Also after a failed or timed-out
  # review, so the pull request says which lanes did not run; not when the
  # run was cancelled.
  post:
    name: post
    needs: [plan, review]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443
      - uses: StephanMeijer/goose-review/post@54f2bd9c019e42a84d643dd59bf1fccc376aac70
        with:
          lanes: ${{ needs.plan.outputs.lanes }}
          provider-routes: ${{ secrets.PROVIDER_ROUTES }}
          provider-env: ${{ secrets.PROVIDER_ENV }}

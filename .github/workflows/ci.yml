name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-pins.sh compares every pin with HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Compile
        run: python3 -m py_compile goose_review.py tests/*.py tests/e2e/assert.py

      # Unit tests, and the engine end to end with tests/fake-goose.
      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Shellcheck
        run: shellcheck render-provider.sh setup-providers.sh options.sh scripts/*.sh tests/e2e/setup.sh

      - name: Actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # review.yml pins this repository's actions; every pin
      # must carry exactly HEAD's action code.
      - name: Check the pins
        run: scripts/check-pins.sh

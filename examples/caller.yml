# .github/workflows/goose-review.yml in your repository: the Goose review
# on every pull request, with your checks (.agents/checks/), facts
# (.agents/facts/) and provider templates (.github/goose/providers/).
name: Goose review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A push never cancels a review in progress: it finishes and posts, and the
# newest push is reviewed after it (pushes in between are skipped; every
# run reviews the whole diff).
concurrency:
  group: goose-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  goose-review:
    # Fork PRs get no secrets; drafts wait until they are ready. Add your
    # release branches here.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    uses: StephanMeijer/goose-review/.github/workflows/review.yml@583a38a2ee99a7f01f76f39a81b9cd84076fadee # v0.3.2
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    with:
      # One lane per reviewing model, each in a job of its own. Checked
      # before any lane runs: a mistyped key, an unknown check or a
      # provider without a template stops the run with the error shown.
      lanes: |
        - lane: deepseek
          provider: my_proxy
          model: deepseek-v4-flash

        - lane: minimax
          provider: my_proxy
          model: MiniMax-M3
          checks: [security, correctness]
      # One model verifies every lane's findings, in one job, and the
      # backup when that one's provider is down. Findings of the verifier's
      # own family (here the minimax lane's) are verified by it too.
      verify-provider: my_proxy
      verify-model: MiniMax-M3
      verify-backup-provider: my_proxy
      verify-backup-model: deepseek-v4-flash
      # The hosts your providers (or your egress proxy) are on, and what
      # `setup` downloads from; the review job can reach nothing else. A JSON
      # list: harden-runner splits its allow-list on single spaces.
      egress-endpoints: '["llm-proxy.example.com:443"]'
      # Your own preparation, before any secret or model runs. For Rust:
      #   setup: cargo fetch --locked
      # with "index.crates.io:443" and "static.crates.io:443" in egress-endpoints.
      ignore: |
        **/Cargo.lock
        **/CHANGELOG.md
      # Your project's tool hints for the model (optional).
      # tools-file: .agents/goose-review/tools.md
      # Tools to install for the model, each pinned by sha256 and announced
      # with its `use` (optional; see the README):
      # tools: |
      #   - name: actionlint
      #     url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
      #     sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      #     use: "Lint a workflow: `actionlint .github/workflows/<file>`."
    secrets:
      # <template name>=<url> per routed template (see examples/providers).
      PROVIDER_ROUTES: ${{ secrets.GOOSE_REVIEW_ROUTES }}
      # NAME=value per key the templates' api_key_env name.
      PROVIDER_ENV: ${{ secrets.GOOSE_REVIEW_PROVIDER_ENV }}

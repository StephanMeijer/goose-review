name: Goose review - post
description: >-
  Publishes every lane's verified findings on the pull request as one
  review, each comment signed with the models of its lane, then writes the
  run's summary comment. Runs in a job of its own that runs no model. The
  review job's artifact is scrubbed again here first: once the models had
  a shell in the review job, nothing later in that job can be trusted, and
  this job runs on a fresh runner with the action's own copy of the script.
author: Stephan Meijer

inputs:
  lanes:
    description: The lanes, as given to the review action.
    required: true
  provider-routes:
    description: Secret. The same value as the review action's; only redacted here.
    default: ""
  provider-env:
    description: Secret. The same value as the review action's; only redacted here.
    default: ""
  github-token:
    description: >-
      Posts the review and replies and writes the summary comment; needs
      pull-requests write, issues write and actions read (the summary's
      links to the jobs).
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Mask the provider settings
      shell: bash
      env:
        GOOSE_REVIEW_PROVIDER_ROUTES: ${{ inputs.provider-routes }}
        GOOSE_REVIEW_PROVIDER_ENV: ${{ inputs.provider-env }}
      run: python3 "$GITHUB_ACTION_PATH/../goose_review.py" mask

    # Missing when the review job failed before uploading; every lane is
    # then reported as "the review did not run".
    - name: Fetch the review
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: goose-review
        path: ${{ runner.temp }}/artifact

    - name: Scrub the findings again
      shell: bash
      env:
        GOOSE_REVIEW_PROVIDER_ROUTES: ${{ inputs.provider-routes }}
        GOOSE_REVIEW_PROVIDER_ENV: ${{ inputs.provider-env }}
      run: |
        mkdir -p "$RUNNER_TEMP/artifact/review"
        python3 "$GITHUB_ACTION_PATH/../goose_review.py" scrub "$RUNNER_TEMP/artifact"

    - name: Post the review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GOOSE_REVIEW_LANES: ${{ inputs.lanes }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: >
        python3 "$GITHUB_ACTION_PATH/../goose_review.py" post
        --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA"
        --dir "$RUNNER_TEMP/artifact/review" --results "$RUNNER_TEMP/results"

    # Last, also when posting failed: one comment, always the pull
    # request's last item, with every lane of this run (a lane without a
    # result shows as such) and the earlier runs folded below.
    - name: Post the summary
      if: ${{ !cancelled() }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GOOSE_REVIEW_LANES: ${{ inputs.lanes }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        mkdir -p "$RUNNER_TEMP/results"
        python3 "$GITHUB_ACTION_PATH/../goose_review.py" summary \
          --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
          --results "$RUNNER_TEMP/results"

name: Goose review - review
description: >-
  The review of the lanes given -- one per job, as the pre-composed
  workflow runs them, or several at once: in each lane the caller's checks
  run with its model, and the findings are scrubbed and uploaded, one
  directory per lane, for the `verify` action. Runs in a job with a
  read-only token and its network blocked but for what it needs (the
  caller's harden-runner step comes first). The model gets a shell in the
  checkout; nothing later in this job is trusted, which is why `post`
  runs in another job.
author: Stephan Meijer

inputs:
  lanes:
    description: >-
      The lanes to review, as YAML (a list of mappings) or JSON: lane,
      provider, model, and optionally checks and jobs. See the README.
      Usually one lane per job; several run at once, each with its own
      model.
    required: true
  checks-dir:
    description: Directory of the check files.
    default: .agents/checks
  facts-dir:
    description: Directory of the facts files. A missing directory means no facts.
    default: .agents/facts
  providers-dir:
    description: Directory of the Goose provider templates (*.json).
    default: .github/goose/providers
  ignore:
    description: Globs never reviewed, one per line (build output, lock files, generated code).
    default: ""
  tools-file:
    description: A file appended to the tools prompt, with the project's own commands. Optional.
    default: ""
  rules-file:
    description: A file whose text replaces the built-in "Only failures that can happen" rules. Optional.
    default: ""
  tools:
    description: >-
      The caller's tools, as given to the tools action (which installs
      them): announced to the model, each with its `use`. Optional.
    default: ""
  budget-minutes:
    description: Each lane's wall-clock budget for its checks.
    default: "35"
  provider-routes:
    description: >-
      Secret. Lines `<template name>=<url>`: each renders that template for
      the route (origin into base_url, path into base_path). Templates
      without a route are used as written.
    default: ""
  provider-env:
    description: >-
      Secret. Lines `NAME=value` (API keys, tokens) that only the Goose
      process gets; a template's `api_key_env` names one.
    default: ""
  artifact:
    description: >-
      The name of the artifact the findings and transcripts are uploaded
      as. It must start with goose-review, which `verify` and `post` fetch;
      give each review job its own (e.g. goose-review-<lane>).
    default: goose-review
  install-goose:
    description: Install Goose. `false` expects a `goose` on PATH (CI uses a fake one).
    default: "true"
  goose-version:
    description: The Goose release to install.
    default: v1.52.0
  goose-sha256:
    description: The sha256 of goose-x86_64-unknown-linux-gnu.tar.gz for goose-version.
    default: 4aee1f770b405c44194c0e9407df1fb06bda4c50eee935f0d8fd10731821cc5e
  install-tools:
    description: Install ripgrep, fd and ast-grep (pinned by sha256), which the tools prompt names.
    default: "true"

runs:
  using: composite
  steps:
    - name: Mask the provider settings
      shell: bash
      env:
        GOOSE_REVIEW_PROVIDER_ROUTES: ${{ inputs.provider-routes }}
        GOOSE_REVIEW_PROVIDER_ENV: ${{ inputs.provider-env }}
      run: python3 "$GITHUB_ACTION_PATH/../goose_review.py" mask

    - name: Install Goose and the reviewer's tools
      shell: bash
      env:
        LOG_DIR: ${{ runner.temp }}/goose-logs
        INSTALL_GOOSE: ${{ inputs.install-goose }}
        INSTALL_TOOLS: ${{ inputs.install-tools }}
        GOOSE_VERSION: ${{ inputs.goose-version }}
        GOOSE_SHA256: ${{ inputs.goose-sha256 }}
      run: '"$GITHUB_ACTION_PATH/../install.sh"'

    - name: Configure the Goose providers
      shell: bash
      env:
        PROVIDERS_DIR: ${{ inputs.providers-dir }}
        GOOSE_REVIEW_PROVIDER_ROUTES: ${{ inputs.provider-routes }}
        GOOSE_REVIEW_LANES: ${{ inputs.lanes }}
      run: |
        if ! "$GITHUB_ACTION_PATH/../setup-providers.sh" "$PROVIDERS_DIR" "$XDG_CONFIG_HOME/goose/custom_providers"; then
          python3 "$GITHUB_ACTION_PATH/../goose_review.py" review-lanes --out "$RUNNER_TEMP/review" \
            --fail "the provider settings are invalid (see the review job log)"
        fi

    # Title and body go through the environment into a file: PR text is
    # never interpolated into a script, and the prompts mark it as data.
    - name: Collect the pull request description
      shell: bash
      env:
        TITLE: ${{ github.event.pull_request.title }}
        BODY: ${{ github.event.pull_request.body }}
      run: printf '# %s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.md"

    # Each lane checks its provider and reviews, into
    # $RUNNER_TEMP/review/<lane>/. A lane that fails stops alone; `post`
    # reports it.
    - name: Review
      shell: bash
      env:
        GOOSE_REVIEW_PROVIDER_ENV: ${{ inputs.provider-env }}
        GOOSE_REVIEW_LANES: ${{ inputs.lanes }}
        BASE: ${{ github.event.pull_request.base.sha }}
        BUDGET: ${{ inputs.budget-minutes }}
        CHECKS_DIR: ${{ inputs.checks-dir }}
        FACTS_DIR: ${{ inputs.facts-dir }}
        IGNORE: ${{ inputs.ignore }}
        TOOLS_FILE: ${{ inputs.tools-file }}
        TOOLS: ${{ inputs.tools }}
        RULES_FILE: ${{ inputs.rules-file }}
      run: |
        source "$GITHUB_ACTION_PATH/../options.sh"
        python3 "$GITHUB_ACTION_PATH/../goose_review.py" review-lanes \
          --base "$BASE" --context "$RUNNER_TEMP/pr.md" --budget-minutes "$BUDGET" \
          --out "$RUNNER_TEMP/review" -- "${options[@]}"

    # The model could write to these directories through its shell, so
    # everything uploaded is scrubbed first, not only what the script wrote.
    # `verify` and `post` scrub again on their own runners: this job is not
    # trusted.
    - name: Scrub the findings and transcripts
      if: always()
      shell: bash
      env:
        GOOSE_REVIEW_PROVIDER_ROUTES: ${{ inputs.provider-routes }}
        GOOSE_REVIEW_PROVIDER_ENV: ${{ inputs.provider-env }}
      run: |
        mkdir -p "$RUNNER_TEMP/review" "$RUNNER_TEMP/goose-logs"
        python3 "$GITHUB_ACTION_PATH/../goose_review.py" scrub "$RUNNER_TEMP/review" "$RUNNER_TEMP/goose-logs"

    - name: Keep the findings and transcripts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact }}
        path: |
          ${{ runner.temp }}/review/**/*.jsonl
          ${{ runner.temp }}/review/**/status.json
          ${{ runner.temp }}/goose-logs/**/*.log
        if-no-files-found: ignore
        retention-days: 14
